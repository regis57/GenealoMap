<style>
/* Layout : application plein écran — carte au centre, frise temporelle flottante en haut à gauche, fiche à droite (en bas sur téléphone). */
:root{
  --sea:#dbe5ea; --land:#f5f6f1; --border:#9fb0b8; --bg:#eef2f4; --panel:#ffffff; --line:#d5dde2;
  --ink:#17232e; --muted:#566673; --direct:#0b6b8a; --blood:#c07a06; --ally:#7b8894; --focus:#b3261e;
  --chip:#e7eef2; --shadow:0 2px 10px rgba(20,40,60,.14);
  --pat:#2f5fd0; --mat:#b23a8e;
  --h0:#f1e6cf; --h1:#e0ecd6; --h2:#e7dfee; --h3:#f1ddd6; --h4:#d9e9e8; --h5:#ecebc6;
  --f-display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --f-body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sea:#0e1820; --land:#1a2731; --border:#40525f; --bg:#0b1218; --panel:#141e26; --line:#273641;
  --ink:#e7eef3; --muted:#94a5b1; --direct:#55bfe0; --blood:#eeae3f; --ally:#8a99a5; --focus:#ff7a70;
  --chip:#1f2c36; --shadow:0 2px 12px rgba(0,0,0,.5); color-scheme:dark;
  --pat:#7fb0ff; --mat:#f08fd0; --h0:#28291f; --h1:#1b2e29; --h2:#24283b; --h3:#2c2733; --h4:#18303b; --h5:#252d20 } }
:root[data-theme="dark"]{
  --sea:#0e1820; --land:#1a2731; --border:#40525f; --bg:#0b1218; --panel:#141e26; --line:#273641;
  --ink:#e7eef3; --muted:#94a5b1; --direct:#55bfe0; --blood:#eeae3f; --ally:#8a99a5; --focus:#ff7a70;
  --chip:#1f2c36; --shadow:0 2px 12px rgba(0,0,0,.5); color-scheme:dark;
  --pat:#7fb0ff; --mat:#f08fd0; --h0:#28291f; --h1:#1b2e29; --h2:#24283b; --h3:#2c2733; --h4:#18303b; --h5:#252d20 }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--direct);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.bar h1{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
button.chip{border:0;font-family:inherit;line-height:inherit}button.chip:hover{outline:1px solid var(--direct)}
.spacer{flex:1 1 0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-weight:500}
.btn:hover{border-color:var(--direct)}
.btn.primary{background:var(--direct);border-color:var(--direct);color:var(--panel)}
.search{position:relative;flex:1 1 180px;max-width:300px;min-width:0}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px}
.results{position:absolute;z-index:30;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:300px;overflow:auto}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px}
.results button:hover,.results button:focus{background:var(--chip)}
.results small{color:var(--muted)}
main{flex:1 1 0;min-height:0;display:flex}
#mapwrap{position:relative;flex:1 1 0;min-width:0;background:var(--sea);overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#map.drag{cursor:grabbing}
#map:focus-visible{outline-offset:-3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#histnote{color:var(--muted);font-size:11px}
.sech{display:block;margin-top:14px}
.cl{font-size:13px;padding:2px 6px;overflow-wrap:anywhere}
/* Vue en arbre : listes imbriquées, traits de liaison en CSS. .tv = de haut en bas, .tv.up = ascendants au-dessus, .th = de gauche à droite. */
#tree{position:absolute;inset:192px 0 0;overflow:auto;background:var(--bg);padding:12px 12px 60px;border-top:1px solid var(--line)}
.tmode{background:var(--bg)!important}.tmode #map{visibility:hidden}
#time,#ticker{z-index:3}
#treebar{position:absolute;z-index:3;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 460px)}
.tmode #zoomctl,.tmode #legend{display:none}
.tr{display:inline-block;min-width:100%}
.tr ul{display:flex;justify-content:center;list-style:none;margin:0;padding:0;position:relative}.tr>ul{gap:18px;align-items:flex-start}
.tr li{display:flex;align-items:center;position:relative}
.tv li{flex-direction:column;padding:16px 5px 0}.tv ul ul{padding-top:16px}
.tv li::before,.tv li::after{content:"";position:absolute;top:0;width:50%;height:16px;border-top:1px solid var(--border)}
.tv li::before{right:50%}.tv li::after{left:50%;border-left:1px solid var(--border)}
.tv li:first-child::before,.tv li:last-child::after{border-top:0}
.tv ul ul::before{content:"";position:absolute;top:0;left:50%;height:16px;border-left:1px solid var(--border)}
.tv>ul>li{padding-top:0}.tv>ul>li::before,.tv>ul>li::after{display:none}
.tv.up li{flex-direction:column-reverse;padding:0 5px 16px}.tv.up ul ul{padding-top:0;padding-bottom:16px}
.tv.up li::before,.tv.up li::after{top:auto;bottom:0;border-top:0;border-bottom:1px solid var(--border)}
.tv.up li:first-child::before,.tv.up li:last-child::after{border-bottom:0}
.tv.up ul ul::before{top:auto;bottom:0}.tv.up>ul>li{padding-bottom:0}
.th ul{flex-direction:column}.th li{flex-direction:row;padding:4px 0 4px 18px}.th ul ul{padding-left:18px}
.th li::before,.th li::after{content:"";position:absolute;left:0;height:50%;width:18px;border-left:1px solid var(--border)}
.th li::before{bottom:50%}.th li::after{top:50%;border-top:1px solid var(--border)}
.th li:first-child::before,.th li:last-child::after{border-left:0}
.th ul ul::before{content:"";position:absolute;left:0;top:50%;width:18px;border-top:1px solid var(--border)}
.th>ul>li{padding-left:0}.th>ul>li::before,.th>ul>li::after{display:none}
.nd{display:flex;flex-direction:column;align-items:flex-start;gap:1px;flex:none;width:168px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;text-align:left;font-size:12.5px;overflow-wrap:anywhere}
.nd:hover{border-color:var(--direct)}.nd.off{opacity:.55}.nd.root{border-color:var(--focus);border-width:2px}.nd small{color:var(--muted);font-size:11px}.nd:disabled{cursor:default}
#time{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));width:min(430px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#play{width:42px;height:42px;border-radius:50%;border:0;background:var(--direct);color:var(--panel);font-size:17px;flex:none}
#year{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:86px}
#living{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#dir{white-space:nowrap}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 8px;font-size:12px}
#histo{width:100%;height:34px;display:block}
#slider{width:100%;margin:0;accent-color:var(--direct)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#zoomctl{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px}
#zoomctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:16px;box-shadow:var(--shadow)}
#ticker{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:min(430px,calc(100% - 64px));display:flex;flex-direction:column;gap:4px;pointer-events:none}
#ticker div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;box-shadow:var(--shadow)}
#ticker b{font-variant-numeric:tabular-nums}
#legend{position:absolute;right:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;max-width:260px;flex-direction:column;gap:3px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.d-pat{background:var(--pat)}.d-mat{background:var(--mat)}.d-both{background:var(--blood)}.d-direct{background:var(--direct)}.d-blood{background:var(--blood)}.d-ally{background:var(--ally)}.d-self{background:var(--focus)}
#panel{flex:0 0 370px;max-width:42%;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#panel h2{font-family:var(--f-display);font-size:18px;margin:0 0 2px;text-wrap:balance}
#panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 6px;font-weight:600}
.sub{color:var(--muted);font-size:13px}
.note{background:var(--chip);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--muted);margin:10px 0}
.note b{color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:12px 1fr auto;gap:2px 8px;align-items:baseline;text-align:left;border:0;background:none;border-radius:7px;padding:5px 6px;width:100%}
.row:hover{background:var(--chip)}
.row .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .ag{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}
.row .tt{grid-column:2 / 4;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.place-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border:0;background:none;width:100%;text-align:left;padding:6px 6px 2px;font-weight:600;border-top:1px solid var(--line);margin-top:6px}
.place-h span:last-child{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.title-line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:600;background:var(--chip)}
.badge.direct{color:var(--direct)}.badge.blood{color:var(--blood)}.badge.self{color:var(--focus)}
.linkbtn{border:0;background:none;color:var(--direct);padding:0;text-decoration:underline;font-size:12.5px}
.ev{display:grid;grid-template-columns:92px 1fr;gap:2px 8px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ev .d{font-variant-numeric:tabular-nums;color:var(--muted)}
.ev details{grid-column:2}
.ev summary{cursor:pointer;color:var(--muted);font-size:12px}
.ev p{margin:4px 0;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.proofs{display:flex;flex-wrap:wrap;gap:5px}
.proofs a{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--direct);text-decoration:none;font-variant-numeric:tabular-nums}
.proofs a:hover{border-color:var(--direct);background:var(--chip)}
a{color:var(--direct)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#settings{position:absolute;z-index:40;top:52px;right:max(12px,env(safe-area-inset-right,0px));width:min(340px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;max-height:calc(100% - 64px);overflow:auto}
#settings summary{cursor:pointer;font-size:13px;margin-top:10px}
#settings a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
#settings a.btn[aria-disabled=true]{opacity:.6;cursor:default}
#lang{padding:6px 8px}
#settings label{display:block;margin:8px 0;font-size:13px}
#settings input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 8px;margin-top:3px}
#drop{position:absolute;inset:0;z-index:50;background:color-mix(in srgb,var(--direct) 22%,transparent);display:grid;place-items:center;font-family:var(--f-display);font-size:22px;pointer-events:none}
.evb{display:block}.cath{margin-top:8px;font-weight:600}.nw{white-space:nowrap}#ttlinput{min-width:220px}
html,body{margin:0}[hidden]{display:none!important}
.plist{font-size:12.5px;width:100%;border-collapse:collapse}
.plist td{padding:3px 4px;border-bottom:1px dashed var(--line);vertical-align:top;overflow-wrap:anywhere}
@media (max-width:1180px){#legend{display:none}}
@media (max-width:760px){
  .tmode #ticker{display:none}#tree{inset:190px 0 0;padding:8px 8px 50px}#treebar{top:150px;left:8px;right:auto;max-width:none;justify-content:flex-start}.nd{width:138px;font-size:12px}
  main{flex-direction:column}
  .bar{gap:6px 8px;padding-block:6px}.bar h1{font-size:15px}#filechip,.bar .spacer{display:none}.search{flex:1 1 120px}
  #time{padding:8px 10px;gap:4px}#histo,.ticks{display:none}#play{width:36px;height:36px}
  #panel{flex:0 0 44%;max-width:none;border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px))}
  #legend{display:none}#ticker div:nth-child(n+3){display:none}

  #histo{height:24px}
}

<body>


<div id="app">
  <header class="bar">
    <h1>GenealoMap</h1>
    <span class="chip" id="filechip">…</span>
    <button type="button" class="chip" id="refchip">…</button>
    <span class="spacer"></span>
    <div class="search"><input id="q" type="search" autocomplete="off"><div class="results" id="qres" hidden></div></div>

  </header>
  <main>

          <div><div id="year">—</div><div id="living">&nbsp;</div><div id="histnote"></div></div>
          <span class="spacer"></span>

        </div>
        <canvas id="histo" aria-hidden="true"></canvas>

      </div>
      <div id="treebar" hidden>
        <select class="mini" id="trMode"><option value="t" data-i="trTime"></option><option value="a" data-i="trAsc"></option><option value="d" data-i="trDesc"></option></select>
        <select class="mini" id="trDir"><option value="v" data-i="trV"></option><option value="h" data-i="trH"></option></select>
        <select class="mini" id="trGen"><option value="3"></option><option value="4" selected></option><option value="5"></option><option value="6"></option><option value="8"></option><option value="10"></option><option value="12"></option><option value="16"></option></select>
      </div>
      <div id="tree" hidden><div id="treebody"></div></div>
      <div id="ticker" aria-live="off"></div>
      <div id="sr" class="sr" aria-live="polite"></div>
      <div id="legend"></div>
      <div id="zoomctl"><button type="button" id="zin">+</button><button type="button" id="zout">−</button><button type="button" id="zfit">⤢</button></div>
      <div id="drop" hidden data-i="drop"></div>
    </section>
    <aside id="panel"></aside>
  </main>
  <div id="settings" hidden>
    <strong data-i="settings"></strong>
    <label><input type="checkbox" id="follow" checked> <span data-i="sFollow"></span></label>
    <label><input type="checkbox" id="anon"> <span data-i="sAnon"></span></label>
    <label><input type="checkbox" id="lines" checked> <span data-i="sLines"></span></label>
    <label><span data-i="sRoute"></span> <select class="mini" id="route"><option value="" data-i="rtNone"></option><option value="person" data-i="rtPerson" selected></option><option value="pat" data-i="rtPat"></option><option value="mat" data-i="rtMat"></option></select></label>
    <label><span data-i="sTint"></span> <select class="mini" id="tint"><option value="" data-i="tnKin"></option><option value="branch" data-i="tnBranch"></option><option value="name" data-i="tnName"></option></select></label>
    <label><input type="checkbox" id="histOpt" checked> <span data-i="sHist"></span><br><span class="sub" id="histHint"></span></label>
    <label><input type="checkbox" id="tilesOpt"> <span data-i="sTiles"></span><br><span class="sub" id="tilesHint"></span></label>
    <label><span data-i="sTheme"></span> <select class="mini" id="theme"><option value="" data-i="thAuto"></option><option value="light" data-i="thLight"></option><option value="dark" data-i="thDark"></option></select></label>
    <label><span data-i="sTpl"></span>

      <span class="sub" data-i="sTplHint"></span></label>
    <div class="acts"><button type="button" class="btn" id="places" data-i="sPlaces"></button><button type="button" class="btn" id="sample" data-i="sSample"></button><button type="button" class="btn" id="forget" data-i="sForget"></button><button type="button" class="btn" id="csvtpl" data-i="tplCsv"></button><button type="button" class="btn" id="chrono" data-i="chrono"></button></div>
    <strong class="sech" data-i="sShare"></strong>
    <label><input type="checkbox" id="shLiving" checked> <span data-i="shLiving"></span></label>
    <div class="acts"><button type="button" class="btn" id="shImg" data-i="shImg"></button><button type="button" class="btn" id="shVid" data-i="shVid"></button></div>

    <details><summary data-i="kbT"></summary><p class="sub" id="kbhelp" data-i="kbHelp"></p></details>
    <details><summary data-i="sAbout"></summary><p class="sub" data-ih="about"></p></details>

    <div class="acts"><a class="btn" id="support">Buy me a beer</a><a class="btn" href="https://github.com/regis57/GenealoMap" target="_blank" rel="noopener"><span data-i="code"></span> ↗</a></div>
  </div>
</div>

function t(k,...a){let s=(L[LANG]&&L[LANG][k]);if(s==null)s=L.fr[k];if(s==null)return k;if(typeof s!=='string')return s;

  return s.replace(/\{(\d)\}/g,(m,i)=>a[i]==null?'':a[i])}

const sx3=(s,m,f,n)=>s==='M'?m:s==='F'?f:(n||m);
const rep=(s,n)=>s.repeat(Math.max(0,n));

  sib(s,half){return (half?'demi-':'')+sx3(s,'frère','sœur','frère ou sœur')},
  uncle(n,s){if(n===2)return sx3(s,'oncle','tante','oncle ou tante');if(n<=7)return rep('arrière-',n-3)+sx3(s,'grand-oncle','grand-tante');return sx3(s,'frère','sœur')+' d’un ancêtre à la '+(n-1)+'e génération'},

function parseGed(text){
  const recs=[];let stack=[];
  for(const ln of text.split(/\r\n|\r|\n/)){
    const m=/^\s*(\d+)\s+(?:(@[^@]+@)\s+)?(\S+)(?: (.*))?$/.exec(ln);if(!m)continue;
    const lvl=+m[1],tag=m[3].toUpperCase(),val=(m[4]||'').replace(/^@@/,'@');
    if(tag==='CONC'||tag==='CONT'){const p=stack[lvl-1];if(p)p.val+=(tag==='CONT'?'\n':'')+val;continue}
    const node={tag,val,xref:m[2]||null,ch:[]};
    if(lvl===0){recs.push(node);stack=[node]}else{const p=stack[lvl-1];if(!p)continue;p.ch.push(node);stack[lvl]=node;stack.length=lvl+1}
  }
  return recs;
}
const MON={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12,JANV:1,FEV:2,FEVR:2,MARS:3,AVR:4,MAI:5,JUIN:6,JUIL:7,AOUT:8,SEPT:9,MRZ:3,OKT:10,DEZ:12,ENE:1,ABR:4,AGO:8,DIC:12,MRT:3,MEI:5,SET:9,OUT:10};
function parseDate(s){
  if(!s)return null;const u=s.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let q='';if(/^(ABT|EST|CAL|CIRCA|VERS|ENV|BET|FROM|ENTRE|HACIA|ROND|CERCA)/.test(u))q='~';else if(/^(BEF|AVANT|TO |ANTES|VOOR )/.test(u))q='<';else if(/^(AFT|APRES|DESPUES|DEPOIS|NA )/.test(u))q='>';
  const ym=/(?:^|\D)(\d{3,4})(?!\d)/.exec(u);if(!ym)return null;const y=+ym[1];
  const head=u.slice(0,ym.index+ym[0].length-ym[1].length).trim();
  const mm=/([A-Z]{3,5})\.?$/.exec(head);const m=mm?(MON[mm[1]]||0):0;
  const dm=m?/(\d{1,2})\s+[A-Z]{3,5}\.?$/.exec(head):null;
  let d=dm?+dm[1]:0,mo=m;
  if(!m){const n=/(\d{1,2})[\/.\-](\d{1,2})[\/.\-]$/.exec(head);if(n){d=+n[1];mo=+n[2]}}
  return {y,m:mo,d,q};
}
const p2=n=>String(n).padStart(2,'0');
function fmtDate(dt){if(!dt)return '';const pre=dt.q==='~'?t('vers'):dt.q==='<'?t('avant'):dt.q==='>'?t('apres'):'';return pre+(dt.d?p2(dt.d)+'/':'')+(dt.m?p2(dt.m)+'/':'')+dt.y}
function coord(v){if(!v)return NaN;v=v.trim().replace(',','.');const m=/^([NSEW])\s*([\d.]+)$/i.exec(v);if(m){const n=parseFloat(m[2]);return /[SW]/i.test(m[1])?-n:n}return parseFloat(v)}
function placeOf(node){
  const pl=node.ch.find(c=>c.tag==='PLAC');if(!pl||!pl.val.trim())return null;
  const key=pl.val.trim();let P=S.places.get(key);
  if(!P){P={name:key,lat:NaN,lon:NaN,q:null,n:0};S.places.set(key,P)}
  P.n++;

  if(map&&isNaN(P.lat)){const la=coord((map.ch.find(c=>c.tag==='LATI')||{}).val),lo=coord((map.ch.find(c=>c.tag==='LONG')||{}).val);if(!isNaN(la)&&!isNaN(lo)){P.lat=la;P.lon=lo;P.q='gedcom'}}

}
function readEvents(rec,owner){
  const out=[];

    const dn=c.ch.find(x=>x.tag==='DATE'),hasP=c.ch.some(x=>x.tag==='PLAC');
    if(!dn&&!hasP)continue;if(/^(NAME|FAMC|FAMS|SOUR|OBJE|NOTE|CHAN|HUSB|WIFE|CHIL)$/.test(c.tag))continue;
    const ty=c.ch.find(x=>x.tag==='TYPE');
    const notes=c.ch.filter(x=>x.tag==='NOTE').map(x=>x.val).join('\n\n');
    const src=c.ch.filter(x=>x.tag==='SOUR').map(x=>x.val).join(' ; ');
    out.push({tag:c.tag,label:(c.tag==='EVEN'&&(ty||c.val))?(ty?ty.val:c.val):null,val:c.tag==='EVEN'?'':c.val,date:parseDate(dn&&dn.val),place:placeOf(c),note:notes,src,owner});

function indexProofs(text){
  const t=text.replace(/\r?\n\d+ CONC /g,'');let m;
  const r1=/(?:Preuves?|Proofs?|Belege?|Prov[ae]s?|Pruebas?|Bewij(?:s|zen)|Beweis(?:er)?)\s+(\d+[a-z]?)\s*:\s*(https?:\/\/[^\s\]\)]+)/gi;while((m=r1.exec(t)))if(!S.proofs.has(m[1].toLowerCase()))S.proofs.set(m[1].toLowerCase(),m[2]);
  const r2=/(\d+[a-z]?)\s*\[[^\]\[]{0,20}?(https?:\/\/[^\s\]]+)\]/g;while((m=r2.exec(t)))if(!S.proofs.has(m[1].toLowerCase()))S.proofs.set(m[1].toLowerCase(),m[2]);
}
function proofsOf(text){
  const out=new Map();let m;
  const r=/(?:preuves?|proofs?|belege?|prov[ae]s?|pruebas?|bewij(?:s|zen)|beweis(?:er)?)\s+((?:\d+[a-z]?)(?:\s*(?:\[[^\]]*\])?\s*(?:,|et|à|-)\s*\d+[a-z]?)*)/gi;
  while((m=r.exec(text))){
    const seg=m[1].replace(/\[[^\]]*\]/g,' ');const ids=seg.match(/\d+[a-z]?/g)||[];
    const range=/(\d+)\s*à\s*(\d+)/.exec(seg);
    if(range){const a=+range[1],b=+range[2];if(b>a&&b-a<60)for(let i=a;i<=b;i++)ids.push(String(i))}
    for(const id of ids){const u=S.proofs.get(id.toLowerCase());if(u)out.set(id.toLowerCase(),u)}
  }
  const other=[];const ru=/https?:\/\/[^\s\]\)<>"]+/g;
  if(!S.proofRev){S.proofRev=new Map();for(const [k,u] of S.proofs)if(!S.proofRev.has(u))S.proofRev.set(u,k)}
  while((m=ru.exec(text))){const u=m[0].replace(/[.,;]+$/,'');const id=S.proofRev.get(u);if(id)out.set(id,u);else if(!other.includes(u))other.push(u)}
  const list=[...out.entries()].sort((a,b)=>parseInt(a[0])-parseInt(b[0])||a[0].localeCompare(b[0]));
  return {list,other};
}

function computeLives(){
  for(const p of S.persons.values()){
    const b=p.ev.find(e=>e.tag==='BIRT'&&e.date)||p.ev.find(e=>(e.tag==='BAPM'||e.tag==='CHR')&&e.date);
    if(b){p.b=b.date.y;p.bEst=b.date.q!==''&&b.date.q!==undefined&&b.date.q!==''?true:false;p.bDate=b.date}
    const d=p.ev.find(e=>e.tag==='DEAT'&&e.date)||p.ev.find(e=>(e.tag==='BURI'||e.tag==='CREM')&&e.date);
    p.dead=!!p.ev.find(e=>e.tag==='DEAT'||e.tag==='BURI'||e.tag==='CREM');
    if(d){p.e=d.date.y;p.eEst=d.date.q!=='';p.dDate=d.date}
  }
  // naissances estimées (3 passes)
  for(let pass=0;pass<4;pass++)for(const p of S.persons.values()){
    if(p.b!=null)continue;let g=null;
    const kids=childrenOf(p.id).map(c=>P(c).b).filter(v=>v!=null);if(kids.length)g=Math.min(...kids)-28;
    if(g==null){for(const f of p.fams){const F=S.fams.get(f);const m=F&&F.ev.find(e=>e.tag==='MARR'&&e.date);if(m){g=m.date.y-25;break}}}
    if(g==null){const sp=spousesOf(p.id).map(s=>P(s).b).filter(v=>v!=null);if(sp.length)g=sp[0]+(p.sex==='M'?-3:3)}
    if(g==null){const pa=parentsOf(p.id).map(s=>P(s).b).filter(v=>v!=null);if(pa.length)g=Math.max(...pa)+28}
    if(g==null){const own=p.ev.filter(e=>e.date).map(e=>e.date.y);if(own.length)g=(p.e!=null?p.e-60:Math.min(...own)-30)}
    if(g!=null){if(p.e!=null&&g>p.e)g=p.e-1;p.b=g;p.bEst=true}
  }
  for(const p of S.persons.values()){
    if(p.b==null)continue;
    if(p.e!=null){if(p.e<p.b)p.e=p.b;continue}
    const own=p.ev.filter(e=>e.date).map(e=>e.date.y);const kids=childrenOf(p.id).map(c=>P(c).b).filter(v=>v!=null);
    const last=Math.max(p.b,...own,...kids);
    if(!p.dead&&p.b>NOW-100){p.e=NOW;p.alive=true}else{p.e=Math.min(Math.max(last,p.b+62),p.b+100);p.eEst=true}

}
function located(k){const Q=k&&S.places.get(k);return Q&&!isNaN(Q.lat)?Q:null}

    for(const f of p.fams){const F=S.fams.get(f);if(!F)continue;
      for(const e of F.ev)if(e.date&&located(e.place))tl.push({y:e.date.y,k:e.place});
      for(const c of F.ch){const C=P(c);const be=C&&C.ev.find(e=>e.tag==='BIRT'&&e.date&&located(e.place));if(be)tl.push({y:be.date.y,k:be.place})}}

function upMap(id){let m=S.up.get(id);if(m)return m;m=new Map([[id,0]]);let fr=[id],d=0;while(fr.length&&d<60){d++;const nx=[];for(const x of fr)for(const pa of parentsOf(x))if(!m.has(pa)){m.set(pa,d);nx.push(pa)}fr=nx}S.up.set(id,m);return m}
function blood(a,b){const A=upMap(a),B=upMap(b);let best=null;const sw=A.size>B.size;const sm=sw?B:A,lg=sw?A:B;
  for(const [k,d1] of sm){const d2=lg.get(k);if(d2===undefined)continue;const du=sw?d2:d1,dx=sw?d1:d2,s=du+dx;if(!best||s<best.s||(s===best.s&&Math.max(du,dx)<Math.max(best.du,best.dx)))best={du,dx,s,anc:k}}return best}

  const out=[];if(!prev.has(anc))return out;let c=anc;while(c!=null){out.push(c);c=prev.get(c)}return out.reverse()}

  if(b.dx>b.du&&b.du>0){const pxu=pathUp(x,b.anc);const a=P(pxu[b.dx-b.du]);if(a)c.cSex=a.sex}
  if(b.du===1&&b.dx===1){const pa=parentsOf(ref),pb=parentsOf(x);c.half=pa.length>1&&pb.length>1&&pa.filter(v=>pb.includes(v)).length<2}

function sosaMap(ref){const m=new Map([[ref,1]]);let fr=[[ref,1]],d=0;while(fr.length&&d<40){d++;const nx=[];for(const [id,n] of fr){const p=P(id);if(!p)continue;for(const f of p.famc){const F=S.fams.get(f);if(!F)continue;if(F.h&&P(F.h)&&!m.has(F.h)){m.set(F.h,n*2);nx.push([F.h,n*2])}if(F.w&&P(F.w)&&!m.has(F.w)){m.set(F.w,n*2+1);nx.push([F.w,n*2+1])}}}fr=nx}return m}
/* Lien de x par rapport à ref. Le sang prime : deux personnes qui partagent des grands-parents sont cousins germains, mariées ou non ;
   le mariage s'ajoute au lien de sang, il ne le remplace pas et ne le crée pas. */
function kin(ref,x){
  const key=ref+'|'+x;let r=S.kinCache.get(key);if(r)return r;const px=P(x),K=KIN[LANG]||KIN.fr;
  if(ref===x)r={cat:'self',label:K.self,full:true};
  else{const b=blood(ref,x),isSp=spousesOf(ref).includes(x);
    if(b){const base=bloodTerm(ref,x,b);
      r={cat:(b.dx===0||b.du===0)?'direct':'blood',label:base,du:b.du,dx:b.dx,anc:b.anc};
      if(isSp){r.sp=K.spouse(px.sex);r.base=base;r.label=K.also(r.sp,base)}}
    else if(isSp)r={cat:'ally',label:K.spouse(px.sex),ally:true};
    else{
      for(const s of spousesOf(x)){if(s===ref)continue;const bs=blood(ref,s);if(!bs)continue;const sp=P(s);
        if(bs.dx===0&&bs.du===1)r={label:K.stepParent(px.sex)};
        else if(bs.du===0&&bs.dx===1)r={label:K.childIn(px.sex)};
        else if(bs.du===1&&bs.dx===1)r={label:K.sibIn(px.sex)};
        else if(bs.dx===1&&bs.du>=2){const cx=kinCtx(ref,s,bs);r={label:K.byMarriage(term(bs.du,1,px.sex,cx),px.sex,term(bs.du,1,sp.sex,cx),sp.sex)}}
        else r={label:K.spouseOf(px.sex,nameOf(sp),bloodTerm(ref,s,bs)),full:true};
        r.cat='ally';r.ally=true;break}
      if(!r)for(const t2 of spousesOf(ref)){const bt=blood(t2,x);if(!bt)continue;
        if(bt.dx===0&&bt.du===1)r={label:K.parentIn(px.sex)};
        else if(bt.du===1&&bt.dx===1)r={label:K.sibIn(px.sex)};
        else r={label:K.spouseSide(bloodTerm(t2,x,bt),nameOf(P(t2))),full:true};
        r.cat='ally';r.ally=true;break}
      /* Parenté par alliance à un degré de plus : x est parent par le sang du conjoint (s) d'un parent par le sang (b) de la référence.
         Exemple : le père de l'épouse d'un petit-fils est « beau-père de [ce petit-fils] (petit-fils) ». On retient le chemin le plus court. */
      if(!r){
        if(!S.rf||S.rf.ref!==ref){const list=[];for(const F of S.fams.values()){if(!F.h||!F.w||!P(F.h)||!P(F.w))continue;for(const [b2,s2] of [[F.h,F.w],[F.w,F.h]]){if(b2===ref)continue;const bb=blood(ref,b2);if(bb)list.push([b2,s2,bb])}}S.rf={ref,list}}
        let best=null;for(const [b2,s2,bb] of S.rf.list){if(s2===x)continue;const bs=blood(s2,x);if(bs&&(!best||bb.s+bs.s<best.n))best={b:b2,s:s2,bb,bs,n:bb.s+bs.s}}
        if(best){const B=P(best.b),Sp=P(best.s),bs=best.bs,tb=bloodTerm(ref,best.b,best.bb);
          if(bs.dx===0&&bs.du===1)r={label:K.title(K.parentIn(px.sex),nameOf(B))+' ('+tb+')'};
          else if(bs.du===1&&bs.dx===1)r={label:K.title(K.sibIn(px.sex),nameOf(B))+' ('+tb+')'};
          else r={label:K.title(bloodTerm(best.s,x,bs),nameOf(Sp))+' ('+K.spouseOf(Sp.sex,nameOf(B),tb)+')'};
          r.cat='ally';r.ally=true;r.full=true}}
      if(!r)r={cat:'none',label:K.none,full:true};
    }}
  S.kinCache.set(key,r);return r;
}

function lifeTxt(p){return (p.b!=null?(p.bEst?'≈ ':'')+p.b:'?')+' – '+(p.alive?'':(p.eEst?'≈ ':'')+(p.e!=null?p.e:'?'))}
function placeBlock(G,Y){const ppl=G.people.slice().sort((a,b)=>tintRank(tint(b.id))-tintRank(tint(a.id))||a.b-b.b);
  return '<button type="button" class="place-h" data-k="'+esc(G.k)+'"><span>'+esc(G.Q.name.split(',').slice(0,2).join(', '))+(G.Q.q==='approx'?' <span class="sub">'+t('approxPos')+'</span>':'')+'</span><span>'+ppl.length+'</span></button><div class="rows">'+ppl.map(p=>rowHtml(p,Y)).join('')+'</div>'}
/* ---------- Vue en arbre ----------
   Ascendants ou descendants de la personne choisie (à défaut, de la référence), à la place de la carte. Chaque case porte le titre de parenté
   par rapport à la référence et la couleur du réglage « Couleurs » ; les personnes qui ne sont pas en vie l'année affichée sont estompées. */
const tree={on:false,root:null,max:300,html:''};
function treeNode(p,root,extra){
  const alive=p.b!=null&&S.year>=p.b&&S.year<=p.e;
  return '<button type="button" class="nd'+(alive?'':' off')+(root?' root':'')+'"'+(p.hid?' disabled':' data-p="'+esc(p.id)+'"')+'><span><i class="dot d-'+tint(p.id)+'"></i><b>'+esc(dispName(p))+'</b></span>'
    +(p.hid?'':'<small>'+lifeTxt(p)+'</small><small>'+esc(titleOf(p.id).text)+'</small>')+(extra||'')+'</button>';
}
function treeHtml(id,g,down,n,root){
  const p=P(id);if(!p||n.c>=tree.max){n.cut=true;return ''}n.c++;let sub='',extra='';
  if(down){const sp=spousesOf(id);if(sp.length)extra='<small>⚭ '+esc(sp.map(s=>dispName(P(s))).join(', '))+'</small>'}
  if(g>1)for(const k of (down?[...new Set(childrenOf(id))]:parentsOf(id).slice(0,2)))sub+=treeHtml(k,g-1,down,n,false);
  return '<li>'+treeNode(p,root,extra)+(sub?'<ul>'+sub+'</ul>':'')+'</li>';
}
/* Arbre « contemporains » : il suit la frise. Pour l'année affichée, on part des ascendants de la personne choisie qui sont en vie
   (les plus anciens d'entre eux), et on descend vers tous leurs descendants en vie cette année-là : la parentèle vivante autour d'elle.
   Un défunt n'apparaît, estompé, que s'il relie deux vivants. Une personne déjà placée n'est pas développée une seconde fois. */
function treeEra(p,g,n){
  const Y=S.year,al=q=>!!q&&q.b!=null&&Y>=q.b&&Y<=q.e,up=upMap(p.id);let tops=[];
  for(const id of up.keys())if(al(P(id))&&!parentsOf(id).some(a=>al(P(a))))tops.push(id);
  if(!tops.length){if(p.b!=null&&Y>p.e)tops=[p.id];else{let d=Infinity;for(const [id,dep] of up){const q=P(id);if(q&&q.b!=null&&q.b<=Y&&dep<d)d=dep}for(const [id,dep] of up)if(dep===d&&P(id)&&P(id).b<=Y)tops.push(id)}}
  const memo=new Map(),live=(id,d)=>{let v=memo.get(id);if(v!==undefined)return v;memo.set(id,false);v=al(P(id))||(d<14&&childrenOf(id).some(c=>live(c,d+1)));memo.set(id,v);return v};
  /* frères et sœurs en vie du plus ancien ascendant vivant : on remonte d'un cran, jusqu'au parent défunt qui les relie */
  tops=[...new Set(tops.map(id=>{for(const q of parentsOf(id))if(new Set(childrenOf(q)).size>1&&[...new Set(childrenOf(q))].filter(c=>P(c).b!=null&&P(c).b<=Y&&live(c,0)).length>1)return q;return id}))];
  const drop=new Set();tops=tops.filter(id=>{if(drop.has(id))return false;const sp=spousesOf(id);if(sp.some(s=>up.has(s)&&al(P(s))&&!tops.includes(s)))return false;for(const s of sp)drop.add(s);return true});
  const seen=new Set(),node=(id,gl)=>{
    const q=P(id);if(!q)return '';if(n.c>=tree.max){n.cut=true;return ''}n.c++;const dup=seen.has(id);seen.add(id);let sub='';
    const sp=spousesOf(id).filter(s=>al(P(s))),extra=sp.length?'<small>⚭ '+esc(sp.map(s=>dispName(P(s))).join(', '))+'</small>':'';
    if(!dup&&gl>1)for(const k of new Set(childrenOf(id))){const c=P(k);if(c&&c.b!=null&&c.b<=Y&&live(k,0))sub+=node(k,gl-1)}
    return '<li>'+treeNode(q,id===p.id,extra)+(sub?'<ul>'+sub+'</ul>':'')+'</li>'};
  return tops.map(id=>node(id,g)).join('');
}
function renderTree(){
  const sp=S.sel.type==='person'?P(S.sel.id):null,p=(sp&&!sp.hid?sp:P(S.ref));const el=$('#treebody');if(!p){el.innerHTML='';return}
  const md=$('#trMode').value,down=md!=='a',hz=$('#trDir').value==='h',n={c:0,cut:false},key=p.id+'|'+md+'|'+hz;
  const body=md==='t'?treeEra(p,+$('#trGen').value,n):treeHtml(p.id,+$('#trGen').value,down,n,true);
  const html=(body?'<div class="tr '+(hz?'th':down?'tv':'tv up')+'"><ul>'+body+'</ul></div>':'<p class="note">'+t('noRel')+'</p>')+(n.cut?'<p class="note">'+t('trMore',tree.max)+'</p>':'');
  if(html!==tree.html){tree.html=html;el.innerHTML=html} /* ne rien redessiner si rien n'a changé : on garde le clic et le focus en cours */
  $('#tree').setAttribute('aria-label',t('treeL',dispName(p)));
  if(tree.root!==key){tree.root=key;const r=el.querySelector('.root');if(r&&r.scrollIntoView)r.scrollIntoView({block:'center',inline:'center'})}
}

/* Pendant la lecture, les listes sont réécrites plusieurs fois par seconde : le bouton pressé peut avoir été remplacé avant que le doigt se relève,

let pressed=null;

document.addEventListener('pointerup',e=>{const d=pressed;pressed=null;if(!d||d.t.isConnected||Math.hypot(e.clientX-d.x,e.clientY-d.y)>8)return;
  const el=document.elementFromPoint(e.clientX,e.clientY),b=el&&el.closest&&el.closest('#panel button,#treebody button');if(b&&!b.disabled)b.click()},true);

    const gs=d.groups.slice().sort((a,b)=>b.people.length-a.people.length);h+=gs.map(G=>placeBlock(G,Y)).join('');
    if(d.lost.length)h+='<h3>'+t('noPlace',d.lost.length)+'</h3><div class="rows">'+d.lost.map(p=>rowHtml(p,Y)).join('')+'</div>';

  marriage_date:['marriage_date','mariage_date','date_mariage'],marriage_place:['marriage_place','mariage_lieu','lieu_mariage'],

    let gv=o.given,sn=o.surname;if(!gv&&!sn&&o.name){const w=o.name.split(' ');sn=w.length>1?w.pop():'';gv=w.join(' ')}

    if(o.occupation)L2.push('1 OCCU '+o.occupation);
    for(const seg of o.residences.split(/\s*\|\s*|\s*;\s*(?=[~<>]?\d{3,4}\b[^=]*=)/).filter(Boolean)){const i=seg.indexOf('=');if(i<0)ev('RESI','',seg);else ev('RESI',seg.slice(0,i),seg.slice(i+1))}
    if(/^https?:\/\//i.test(o.profile_url))L2.push('1 WWW '+o.profile_url);

    for(const c of F.ch)L2.push('1 CHIL '+xid(c));if(F.md||F.mp){L2.push('1 MARR');const gd=csvDate(F.md);if(gd)L2.push('2 DATE '+gd);for(const l of csvPlace(F.mp,2))L2.push(l)}}

  cv.setAttribute('aria-label',t('mapL'));renderLegend();$('#refchip').title=t('refTip');
  for(const o of $('#trGen').options)o.textContent=t('trGen',o.value);$('#viewbtn').textContent=t(tree.on?'vMap':'vTree');if(share.rec)$('#shVid').textContent=t('shStop');histNote();
  const a=$('#support');if(SUPPORT_URL){a.href=SUPPORT_URL;a.target='_blank';a.rel='noopener noreferrer';a.textContent='🍺 '+t('support');a.removeAttribute('aria-disabled')}else{a.removeAttribute('href');a.textContent='🍺 '+t('supportSoon');a.setAttribute('aria-disabled','true')}
}
function setLang(l){LANG=LANGS[l]?l:'en';store.set('cg.lang',LANG);$('#lang').value=LANG;S.kinCache.clear();applyLang();if(S.persons.size){renderChips();setYear(S.year,true)}}
$('#lang').innerHTML=Object.entries(LANGS).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');
$('#lang').onchange=e=>setLang(e.target.value);
$('#tilesOpt').onchange=e=>{store.set('cg.tiles',e.target.checked?'1':'');if(e.target.checked)probeTiles();else{tiles.ok=false;tiles.ko=false;tiles.cache.clear();applyLang();dirty()}};
$('#csvtpl').onclick=()=>download(new Blob(['﻿'+CSV_TEMPLATE],{type:'text/csv'}),'genealomap-template.csv');

/* ---------- Démarrage ---------- */
function boot(){
  {const av=(ARGS.get('lang')||'').toLowerCase(),sv=store.get('cg.lang'),nv=(navigator.language||'en').slice(0,2).toLowerCase();LANG=LANGS[av]?av:LANGS[sv]?sv:LANGS[nv]?nv:'en';$('#lang').value=LANG;
    if(ARGS.get('hist')==='0'||store.get('cg.hist')==='0'){hist.on=false;$('#histOpt').checked=false}
    {const tv=(store.get('cg.tree')||'').split(',');if(tv[3]==='2'&&/^[adt]$/.test(tv[0]))$('#trMode').value=tv[0];if(/^[vh]$/.test(tv[1]))$('#trDir').value=tv[1];else if(window.innerWidth<760)$('#trDir').value='h';if(/^(3|4|5|6|8|10|12|16)$/.test(tv[2]))$('#trGen').value=tv[2]}
    {const rt=store.get('cg.route'),tn=store.get('cg.tint');if(rt)$('#route').value=rt==='none'?'':rt;if(tn)$('#tint').value=tn}
    setTheme(ARGS.get('theme')||store.get('cg.theme'));applyLang()}
  if(store.get('cg.tiles')){$('#tilesOpt').checked=true;probeTiles()}
  readColors();resize();
  const saved=store.get('cg.ged');
  if(!pub.name&&saved&&isGed(saved))loadGed(saved,store.get('cg.name')||'tree.ged',false);else loadGed(SAMPLE,'sample',true);
  const go=()=>{if(ARGS.get('play')==='1')setPlaying(true)};
  if(pub.name){const pubFile=pub.name;
    fetch(pubFile).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>{if(b.byteLength>MAX_FILE)throw 0;return fileText(b)})
      .then(txt=>{if(!isGed(txt))throw 0;pub.on=true;loadGed(txt,pub.name,false);go()}).catch(()=>{pub.on=false;pub.ko=true;renderPanel();go()})}
  else go();
  if(ARGS.get('view')==='tree')setView(true);
  fetch('world.json').then(r=>r.json()).then(w=>{S.world=w;buildWorldPath();ccNames=null;if(S.gazIndex){resolvePlaces();afterPlaces(false)}dirty()}).catch(()=>{});
}
boot();
</script>
</body>
